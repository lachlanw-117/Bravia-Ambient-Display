name: Bravia Ambient Photo Host
version: 0.1.0
slug: bravia_ambient
description: Local photos, weather and household notices for the family TV screensaver
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Authenticated photo, weather and notice feeds (trusted LAN only)
map:
  - type: share
    read_only: true
options:
  access_key: ''
  weather_entity: weather.forecast_home
  time_zone: Australia/Sydney
  outlook_calendar_id: ''
  outlook_client_id: ''
schema:
  access_key: password
  weather_entity: str
  time_zone: str
  outlook_calendar_id: str
  outlook_client_id: str
